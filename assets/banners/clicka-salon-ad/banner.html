<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap');

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Manrope', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: #ffffff;
  }

  .canvas {
    width: 1080px;
    height: 1080px;
    background: #ffffff;
    position: relative;
    display: flex;
    align-items: center;
  }

  /* Subtle pink blob behind phone */
  .bg-blob {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%);
    width: 660px;
    height: 660px;
    background: radial-gradient(circle, rgba(232,72,133,0.07) 0%, rgba(168,85,247,0.05) 45%, transparent 68%);
    border-radius: 50%;
    pointer-events: none;
  }

  /* Left text column */
  .text-col {
    position: relative;
    z-index: 2;
    padding-left: 72px;
    width: 560px;
    flex-shrink: 0;
  }

  .label {
    font-size: 20px;
    font-weight: 500;
    color: #9ca3af;
    letter-spacing: 0.01em;
    margin-bottom: 32px;
  }

  .headline {
    font-size: 56px;
    font-weight: 900;
    color: #0f0f0f;
    line-height: 1.05;
    letter-spacing: -0.03em;
    margin-bottom: 4px;
  }

  .headline-grad {
    font-size: 56px;
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #e11d48 0%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 40px;
  }

  .divider {
    width: 44px;
    height: 3px;
    background: linear-gradient(90deg, #e11d48, #a855f7);
    border-radius: 2px;
    margin-bottom: 44px;
  }

  .price {
    font-size: 56px;
    font-weight: 900;
    color: #0f0f0f;
    letter-spacing: -0.03em;
    line-height: 1;
    margin-bottom: 10px;
  }

  .ready {
    font-size: 20px;
    font-weight: 600;
    color: #6b7280;
    letter-spacing: -0.01em;
  }

  /* Logo bottom left */
  .logo {
    position: absolute;
    bottom: 56px;
    left: 88px;
    font-size: 22px;
    font-weight: 800;
    background: linear-gradient(135deg, #e11d48 0%, #a855f7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    z-index: 3;
  }

  /* Phone image */
  .phone-col {
    position: absolute;
    right: -20px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 1;
    width: 590px;
  }

  .phone-col img {
    width: 100%;
    height: auto;
    display: block;
  }

</style>
</head>
<body>
<div class="canvas">
  <div class="bg-blob"></div>

  <!-- Text -->
  <div class="text-col">
    <p class="label">За фризьори и салони</p>
    <h1 class="headline">Собствен сайт<br>с резервации.</h1>
    <h2 class="headline-grad">И твоето<br>име.</h2>
    <div class="divider"></div>
    <p class="price">299€</p>
    <p class="ready">Готов веднага · 0% комисионна</p>
  </div>

  <!-- Phone photo -->
  <div class="phone-col">
    <img src="phone.png" alt="Salon website on phone" />
  </div>

  <!-- Logo -->
  <div class="logo">clicka.bg</div>
</div>
</body>
</html>
